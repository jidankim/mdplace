<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open shadow DOM fixture</title>
</head>
<body>
  <fixture-story></fixture-story>
  <script>
    const host = document.querySelector('fixture-story');
    host.attachShadow({mode: 'open'}).innerHTML = `
      <main><article>
        <h1>Open shadow DOM fixture</h1>
        <p>OPEN_SHADOW_SENTINEL is readable only after open-shadow flattening.</p>
        <p>This second paragraph checks the stock content script's shadow DOM bridge.</p>
        <p>The final paragraph keeps the fixture long enough for article extraction.</p>
      </article></main>`;
  </script>
</body>
</html>
